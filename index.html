<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Funky Truck Arizona Redux</title>
  <meta name="description" content="Drive a bouncy monster truck across nine stages of desert hills.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Funky Truck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-256.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Funky Truck Arizona Redux game"></canvas>
    <div id="loading" role="status">
      <div class="loading-title">funky truck</div>
      <div class="loading-track"><div id="loading-bar"></div></div>
    </div>
  </main>

  <div id="touch" aria-hidden="true">
    <div class="pad pad-left">
      <button class="ctl" data-key="left" aria-label="Tilt back">
        <svg viewBox="0 0 24 24"><path d="M7 7a8 8 0 1 1-2 6" /><path d="M7 2v5h5" /></svg>
      </button>
      <button class="ctl" data-key="right" aria-label="Tilt forwards">
        <svg viewBox="0 0 24 24"><path d="M17 7a8 8 0 1 0 2 6" /><path d="M17 2v5h-5" /></svg>
      </button>
    </div>
    <div class="pad pad-right">
      <button class="ctl" data-key="down" aria-label="Reverse">
        <svg viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M6 13l6 6 6-6" /></svg>
      </button>
      <button class="ctl gas" data-key="up" aria-label="Forwards">
        <svg viewBox="0 0 24 24"><path d="M12 19V5" /><path d="M6 11l6-6 6 6" /></svg>
      </button>
    </div>
    <!-- Sandbox: jump (left), fire a missile and boost (right). The icons are ICONS in render-battle.js. -->
    <div class="actions actions-left">
      <button class="act" data-press="jump" aria-label="Jump">
        <svg viewBox="0 0 24 24"><path d="M12 2.5v7 M8.5 6L12 2.5 15.5 6 M7 12.5h10l-10 3h10l-10 3h10 M6 21.5h12" /></svg>
        <b id="jump-count">2</b>
      </button>
    </div>
    <div class="actions actions-right">
      <button class="act" data-press="fire" aria-label="Fire a missile">
        <svg viewBox="0 0 24 24"><path d="M3 9.5h11l5.5 2.5-5.5 2.5H3z M6 9.5L3.5 5.5 M6 14.5l-2.5 4" /></svg>
        <b id="fire-count">3</b>
      </button>
      <button class="act" data-key="boost" aria-label="Boost">
        <svg viewBox="0 0 24 24"><path d="M13.5 2.5L5.5 13.5h6l-1 8 8-11.5h-6z" /></svg>
      </button>
    </div>
  </div>

  <!-- One button on a touch screen: hold anywhere to drive (and to tilt back in the air). -->
  <div id="tap" aria-hidden="true"><span>Hold anywhere to drive · and to tilt back in the air</span></div>

  <div id="corner" aria-hidden="true">
    <button id="pause-button" aria-label="Pause">
      <svg viewBox="0 0 24 24"><path d="M9 6v12" /><path d="M15 6v12" /></svg>
    </button>
    <button id="upright-button" aria-label="Flip upright">
      <!-- turning over: an arrow arcing over, above the ground -->
      <svg viewBox="0 0 24 24"><path d="M5 14a7.5 7.5 0 0 1 13.6-4.4" /><path d="M19.5 4.5v5.5H14" /><path d="M4 20h16" /></svg>
      <span>Flip</span>
    </button>
  </div>

  <!-- Load Stage's From File (a stage saved from the Stage Editor). -->
  <input id="stage-file" type="file" accept=".json,application/json" hidden>

  <!-- The title screen's sound switch, in the top right corner. -->
  <button id="sound-button" aria-label="Sound on or off">
    <svg class="on" viewBox="0 0 24 24"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z" /><path d="M16 9a4 4 0 0 1 0 6" /><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11" /></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z" /><path d="M16 9.5l5 5" /><path d="M21 9.5l-5 5" /></svg>
  </button>

  <div id="fps" hidden></div>

  <noscript>Funky Truck Arizona Redux needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
