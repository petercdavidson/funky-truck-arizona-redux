<!doctype html>
<meta charset="utf-8">
<title>Vectorize</title>
<body>Tracing…
<script type="module">
// Runs in headless Chrome (driven by tools/vectorize.mjs): traces the raster art in art/raster/
// into assets/vector.json. Open it in a browser to run it by hand; the result is window.result.
import { traceSprite, tracePath, kmeans, nearest, blur, fitFill } from './trace.js';

const RASTER = '../../art/raster/';
const load = (f) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(f)); i.src = RASTER + f; });
function pixels(img, sx = 0, sy = 0, w = img.width, h = img.height) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, sx, sy, w, h, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}
const hex = (c) => '#' + c.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

/** Settings per sprite set: colours, mask blur, and whether shading is radial about the origin. */
const SPRITE_OPTS = {
  body: { k: 6, sigma: 1.0, minArea: 4 },
  tyre: { k: 3, sigma: 0.8, radial: true },
  hub: { k: 4, sigma: 0.7, radial: true },
  bar: { k: 4, sigma: 0.6 },
  dirt: { k: 2, sigma: 0.7, radial: true },
};

async function sprites() {
  const frames = await (await fetch('../../art/sprites.json')).json();
  const out = {};
  for (const [key, list] of Object.entries(frames)) {
    const o = SPRITE_OPTS[key];
    if (!o) continue; // the HUD labels become text
    out[key] = [];
    for (const f of list) {
      const img = pixels(await load(f.file));
      const ox = f.tx / f.sx, oy = f.ty / f.sy;
      const shapes = traceSprite(img, { ...o, ox, oy, centre: o.radial ? [-ox, -oy] : null });
      out[key].push({ clip: true, sx: f.sx, sy: f.sy, shapes });
    }
  }
  return out;
}

/** Copy a w*h field into a bigger one with `e` cells of clamped border, then a zero ring. */
function extend(f, w, h, e) {
  const W = w + 2 * e, H = h + 2 * e, g = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) continue;
    const sx = Math.min(w - 1, Math.max(0, x - e)), sy = Math.min(h - 1, Math.max(0, y - e));
    g[y * W + x] = f[sy * w + sx];
  }
  return { g, W, H };
}

async function tiles() {
  const levels = await (await fetch('../../assets/levels.json')).json();
  const used = new Set();
  for (const l of levels.levels) for (const row of l.tiles) for (const id of row) used.add(id);
  const rgb = pixels(await load('tiles_rgb.jpg')), alpha = pixels(await load('tiles_alpha.png'));
  const T = 64, cols = rgb.width / T, count = cols * (rgb.height / T);
  // One palette for all tiles so neighbouring tiles use exactly the same colours.
  const sample = [];
  for (let i = 0; i < rgb.width * rgb.height; i += 7) if (alpha.data[i * 4] > 200) sample.push([rgb.data[i * 4], rgb.data[i * 4 + 1], rgb.data[i * 4 + 2], 1]);
  const palette = kmeans(sample, 4, 3);
  const out = [];
  const E = 3;
  for (let id = 0; id < count; id++) {
    if (!used.has(id) || id === 0) { out.push({ shapes: [] }); continue; }
    const x0 = (id % cols) * T, y0 = Math.floor(id / cols) * T;
    const a = new Float32Array(T * T);
    const lab = new Int8Array(T * T).fill(-1);
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const i = ((y0 + y) * rgb.width + x0 + x) * 4;
      a[y * T + x] = alpha.data[i] / 255;
      if (a[y * T + x] > 0.5) lab[y * T + x] = nearest([rgb.data[i], rgb.data[i + 1], rgb.data[i + 2]], palette);
    }
    let opaque = 0;
    for (const v of a) if (v > 0.5) opaque++;
    if (opaque === 0) { out.push({ shapes: [] }); continue; }
    const shapes = [];
    const ea = extend(blur(a, T, T, 0.45), T, T, E);
    shapes.push({ d: opaque === T * T ? 'M-1 -1H65V65H-1Z' : tracePath(ea.g, ea.W, ea.H, { t: 0.5, tol: 0.3, ox: -E, oy: -E, minArea: 2 }), fill: hex(palette[0]), rule: 'evenodd' });
    for (let j = 1; j < palette.length; j++) {
      const m = new Float32Array(T * T);
      let n = 0;
      for (let i = 0; i < T * T; i++) if (lab[i] === j) { m[i] = 1; n++; }
      if (n < 6) continue;
      const em = extend(blur(m, T, T, 1.0), T, T, E);
      const d = tracePath(em.g, em.W, em.H, { t: 0.42, tol: 0.4, ox: -E, oy: -E, minArea: 4 });
      if (d) shapes.push({ d, fill: hex(palette[j]), rule: 'evenodd' });
    }
    out.push({ clip: true, shapes });
  }
  return { palette: palette.map(hex), tiles: out };
}

/** Vertical gradient stops sampled down column(s) of an image. */
function columnStops(img, xs, step, y0 = 0, y1 = img.height - 1, pick = () => true) {
  const stops = [];
  for (let y = y0; y <= y1; y += step) {
    const acc = [0, 0, 0]; let n = 0;
    for (const x of xs) {
      if (!pick(x, y)) continue;
      const i = (y * img.width + x) * 4;
      acc[0] += img.data[i]; acc[1] += img.data[i + 1]; acc[2] += img.data[i + 2]; n++;
    }
    if (n) stops.push([y, hex(acc.map((v) => v / n))]);
  }
  return stops;
}

async function background() {
  const img = pixels(await load('bg.jpg'));
  const W = img.width, H = img.height;
  const px = (x, y) => { const i = (y * W + x) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; };
  const diff = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
  // Mountain ridge: in each column, the row with the sharpest drop in brightness.
  const L = (x, y) => { const c = px(x, y); return c[0] + c[1] + c[2]; };
  const top = [];
  for (let x = 0; x < W; x++) {
    let best = 230, bd = -1;
    for (let y = 205; y < 320; y++) {
      const d = (L(x, y - 1) + L(x, y - 2)) - (L(x, y + 1) + L(x, y + 2));
      if (d > bd) { bd = d; best = y; }
    }
    top.push(best);
  }
  // Smooth single-pixel noise in the ridge, then build the outline.
  const ridge = top.map((y, x) => (x > 0 && x < W - 1 && Math.abs(top[x - 1] - top[x + 1]) < 2 && Math.abs(y - top[x - 1]) > 2 ? (top[x - 1] + top[x + 1]) / 2 : y));
  const pts = ridge.map((y, x) => [x, y]);
  // Keep the outline light: drop points that lie on a straight line.
  const keep = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = keep[keep.length - 1], b = pts[i + 1], p = pts[i];
    const t = (p[0] - a[0]) / (b[0] - a[0]);
    if (Math.abs(a[1] + (b[1] - a[1]) * t - p[1]) > 0.6) keep.push(p);
  }
  keep.push(pts[pts.length - 1]);
  const minTop = Math.min(...ridge), base = H;
  const ridgeD = `M-2 ${base}L-2 ${ridge[0].toFixed(1)}` + keep.map(([x, y]) => `L${x} ${y.toFixed(1)}`).join('') + `L${W + 2} ${ridge[W - 1].toFixed(1)}L${W + 2} ${base}Z`;
  const toFill = (stops, y0, y1) => ({ type: 'linear', x0: 0, y0, x1: 0, y1, stops: stops.map(([y, c]) => [+((y - y0) / (y1 - y0)).toFixed(4), c]) });
  const allX = Array.from({ length: W }, (_, x) => x);
  const sunX = 469, sunY = 248, sunR = 22;
  const notSun = (x, y) => y > 300 || Math.abs(x - sunX) > 150;
  const sky = columnStops(img, allX, 8, 0, H - 1, (x, y) => (y < ridge[x] - 3 || y > base) && notSun(x, y));
  const mountain = columnStops(img, allX, 6, Math.floor(minTop), base, (x, y) => y > ridge[x] + 2 && notSun(x, y));
  // Sun: a disc (mostly behind the ridge) and a glow. The glow's strength at each distance is
  // how far the sky above the sun is pushed towards the disc colour, compared with open sky.
  const disc = px(sunX, sunY - 14);
  const skyRow = (y) => { const c = [0, 0, 0]; for (let x = 150; x < 300; x++) { const p = px(x, y); c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; } return c.map((v) => v / 150); };
  const glowR = 150, glowStops = [];
  for (let r = sunR; r <= glowR; r += 8) {
    const y = sunY - r, c = px(sunX, y), s = skyRow(y);
    let a = 0, n = 0;
    for (let k = 0; k < 3; k++) if (Math.abs(disc[k] - s[k]) > 8) { a += (c[k] - s[k]) / (disc[k] - s[k]); n++; }
    glowStops.push([+(r / glowR).toFixed(3), Math.max(0, Math.min(1, n ? a / n : 0))]);
  }
  // Keep it falling smoothly to nothing at the edge.
  for (let i = 1; i < glowStops.length; i++) glowStops[i][1] = Math.min(glowStops[i][1], glowStops[i - 1][1]);
  for (const g of glowStops) g[1] *= Math.min(1, (1 - g[0]) / 0.35);
  glowStops.unshift([0, glowStops[0][1]]);
  const rgba = (c, a) => `rgba(${c.map(Math.round).join(',')},${a.toFixed(3)})`;
  return {
    shapes: [
      { d: `M0 0H${W}V${H}H0Z`, fill: toFill(sky, 0, H) },
      { d: `M${sunX - glowR} ${sunY - glowR}h${2 * glowR}v${2 * glowR}h${-2 * glowR}Z`, fill: { type: 'radial', x: sunX, y: sunY, r: glowR, stops: glowStops.map(([o, a]) => [o, rgba(disc, a)]) } },
      { d: `M${sunX + sunR} ${sunY}A${sunR} ${sunR} 0 1 0 ${sunX - sunR} ${sunY}A${sunR} ${sunR} 0 1 0 ${sunX + sunR} ${sunY}Z`, fill: hex(disc) },
      { d: ridgeD, fill: toFill(mountain, Math.floor(minTop), base) },
    ],
    debug: { minTop, glowStops },
  };
}

async function screen() {
  const img = pixels(await load('screen_plain.png'));
  const stops = columnStops(img, [4, 300, 570], 32);
  stops.push(columnStops(img, [4, 300, 570], 1, img.height - 1)[0]);
  return { shapes: [{ d: 'M0 0H576V448H0Z', fill: { type: 'linear', x0: 0, y0: 0, x1: 0, y1: 448, stops: stops.map(([y, c]) => [+(y / 447).toFixed(4), c]) } }] };
}

/** SVG markup for a drawing, with its gradients added to `defs`. */
function svgDrawing(drawing, defs, transform = '') {
  const fill = (f) => {
    if (typeof f === 'string') return f;
    const id = 'g' + defs.length;
    const stops = f.stops.map(([o, c]) => {
      const m = /^rgba\((\d+),(\d+),(\d+),([\d.]+)\)$/.exec(c);
      return m ? `<stop offset="${o}" stop-color="rgb(${m[1]},${m[2]},${m[3]})" stop-opacity="${m[4]}"/>` : `<stop offset="${o}" stop-color="${c}"/>`;
    }).join('');
    defs.push(f.type === 'radial'
      ? `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${f.x}" cy="${f.y}" r="${f.r}">${stops}</radialGradient>`
      : `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f.x0}" y1="${f.y0}" x2="${f.x1}" y2="${f.y1}">${stops}</linearGradient>`);
    return `url(#${id})`;
  };
  const sh = drawing.shapes;
  const path = (x) => `<path d="${x.d}" fill="${fill(x.fill)}"${x.rule === 'evenodd' ? ' fill-rule="evenodd"' : ''}/>`;
  let body = path(sh[0]);
  if (sh.length > 1) {
    let rest = sh.slice(1).map(path).join('');
    if (drawing.clip) {
      const id = 'c' + defs.length;
      defs.push(`<clipPath id="${id}"><path d="${sh[0].d}"${sh[0].rule === 'evenodd' ? ' clip-rule="evenodd"' : ''}/></clipPath>`);
      rest = `<g clip-path="url(#${id})">${rest}</g>`;
    }
    body += rest;
  }
  return `<g${transform ? ` transform="${transform}"` : ''}>${body}</g>`;
}

/** The app icon: the default truck on a strip of ground under the sky, as in icon-512.png. */
function icon(art) {
  const defs = [];
  const parts = [];
  parts.push(svgDrawing(art.bg, defs, 'translate(-300 -150) scale(1.1)'));
  parts.push('<rect x="0" y="170" width="256" height="86" fill="#91775e"/><rect x="0" y="166" width="256" height="7" fill="#ad8862"/>');
  // Truck at rest (see Truck.reset): chassis centre (cx, cy), wheels 36 either side.
  const cx = 128, cy = 136, k = 1.45, R = 45 / 72;
  const g = (inner) => `<g transform="translate(${cx} ${cy}) scale(${k})">${inner}</g>`;
  const wheel = (x) => svgDrawing(art.sprites.tyre[0], defs, `translate(${x} 0) scale(${R})`) + svgDrawing(art.sprites.hub[0], defs, `translate(${x} 0) scale(${R})`);
  const body = svgDrawing(art.sprites.body[0], defs, `translate(${-36 * Math.SQRT1_2} ${-36 * Math.SQRT1_2}) scale(0.7)`);
  parts.push(g(body + wheel(-36) + wheel(36)));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs>${defs.join('')}<clipPath id="icon"><rect x="24" y="24" width="208" height="208" rx="46"/></clipPath></defs><g clip-path="url(#icon)">${parts.join('')}</g></svg>\n`;
}

try {
  const t = await tiles();
  const bg = await background();
  const debug = bg.debug; delete bg.debug;
  const art = { sprites: await sprites(), bg };
  window.icon = icon(art);
  window.result = { version: 1, note: 'Generated by tools/vectorize.mjs from art/raster/. Do not edit by hand.', sprites: art.sprites, palette: t.palette, tiles: t.tiles, bg, screen: await screen() };
  window.debug = debug;
  document.body.textContent = 'Done';
} catch (e) {
  window.error = String(e.stack || e);
  document.body.textContent = window.error;
}
window.done = true;
</script>
