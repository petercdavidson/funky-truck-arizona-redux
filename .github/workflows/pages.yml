# Tests the game and publishes it to GitHub Pages on every push to main.
# One-time setup: in the repository's Settings > Pages, set "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  # Upload and deploy are separate jobs, as in GitHub's own Pages template: in one job the deploy
  # step ran a second after the upload and sometimes found no artifact yet ("Found 0 artifact(s)").
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files (leave out tests and tools)
        run: |
          mkdir _site
          cp -R index.html sounds.html style.css manifest.webmanifest .nojekyll src assets editor _site/
      - name: Stamp the build with its commit (shown after the version on the title screen)
        run: sed -i "s/^export const BUILD = 'dev';/export const BUILD = '${GITHUB_SHA::7}';/" _site/src/version.js && grep BUILD _site/src/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
