<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funky Truck Sounds</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <style>
    :root { --btn: rgba(107, 74, 64, 0.92); --card: rgba(0, 0, 0, 0.16); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fff;
      font-family: "Avenir Next", Avenir, "Nunito", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(#c4826a, #946857) fixed;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: clamp(32px, 7vw, 52px); font-weight: 900; margin: 0; text-shadow: 3px 3px 0 rgba(38, 38, 38, 0.85); }
    .lede { font-weight: 600; opacity: 0.9; max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card.current { outline: 2px solid rgba(255, 255, 255, 0.8); }
    .card h2 { margin: 0; font-size: 22px; font-weight: 800; }
    .card p { margin: 0; font-size: 14px; font-weight: 600; opacity: 0.85; min-height: 3em; }
    .cues { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: inherit; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em;
      color: #fff; background: var(--btn); border: 0; border-radius: 5px; padding: 8px 10px; cursor: pointer;
    }
    button:hover { background: rgba(130, 92, 80, 0.95); }
    button.wide { width: 100%; padding: 10px; }
    button.on { background: #fff; color: #6b4a40; }
    .engine { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    .engine label { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; }
    input[type=range] { width: 100%; accent-color: #fff; }
    a { color: #fff; }
    .back { display: inline-block; margin-top: 18px; font-weight: 700; }
    .button-link { font-weight: 800; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>funky truck sounds</h1>
  <p class="lede">Every sound in the game, synthesised live in the browser (no sound files). Try the cab scrape
    on its own or with the engine running, and the rest of the cues below.</p>
  <div class="card"><div class="cues" id="cues"></div></div>
  <a class="back" href="./">← Back to the game</a>
</main>
<script type="module">
import { Sound } from './src/audio.js';

const sound = new Sound();
let scrape = { on: false, speed: 0 };
let engine = { on: false };
let boost = { on: false };

function tick() {
  sound.updateScrape(scrape, true);
  sound.updateEngine(engine, true);
  sound.updateBoost(boost, true);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
}

/** One slide: the cab drags, slowing down, then lifts off. */
function slide(at = 0, ms = 1100) {
  setTimeout(() => {
    const t0 = performance.now();
    const step = () => {
      const t = (performance.now() - t0) / ms;
      if (t >= 1) { scrape = { on: false, speed: 0 }; return; }
      scrape = { on: true, speed: 0.9 * (1 - t) + 0.1 };
      requestAnimationFrame(step);
    };
    step();
  }, at);
}

const cues = document.getElementById('cues');
const button = (label, f) => cues.append(el('button', { textContent: label, onclick: () => { sound.unlock(); f(); } }));
const cue = (label, name, opts) => button(label, () => sound.play(name, opts, true));
button('Scrape', () => slide());
button('Three scrapes', () => { slide(0, 700); slide(900, 600); slide(1700, 900); });
button('Scrape with engine', () => {
  engine = { on: true, throttle: 1, speed: 0.6, airborne: false };
  slide(400, 1300);
  setTimeout(() => { engine = { on: false }; }, 2200);
});
button('Rocket boost (held)', () => {
  sound.play('boost', {}, true);
  boost = { on: true, speed: 0.3 };
  const t0 = performance.now();
  const up = () => { if (!boost.on) return; boost = { on: true, speed: Math.min(1, 0.3 + (performance.now() - t0) / 2500) }; requestAnimationFrame(up); };
  up();
  setTimeout(() => { boost = { on: false }; }, 2500);
});
button('Rolling (tyres on ground)', () => {
  engine = { on: true, throttle: 0, speed: 0.9, airborne: false };
  setTimeout(() => { engine = { on: false }; }, 2500);
});
cue('Start', 'start'); cue('Bump', 'bump', { force: 0.6 }); cue('Land', 'land', { force: 0.8 });
cue('Flip', 'trick', { names: ['Backflip'] }); cue('Double flip', 'trick', { names: ['Double Backflip'] });
cue('Big Air', 'trick', { names: ['Big Air'] }); cue('Clean', 'trick', { names: ['Clean'] });
cue('Flip count +1', 'flipCount', { turns: 1 }); cue('Flip count +3', 'flipCount', { turns: 3 });
cue('Milestone', 'milestone'); cue('Title truck boing', 'boing');
cue('Stage done', 'stage'); cue('Win', 'win'); cue('Wreck', 'wreck'); cue('Click', 'click');
cue('Battle: missile', 'missile'); cue('Battle: enemy missile', 'enemyMissile');
cue('Battle: boom', 'boom'); cue('Battle: big boom', 'boom', { big: true }); cue('Battle: crunch', 'crunch', { force: 0.8 });
cue('Sandbox: tumbleweed hit', 'weed', { force: 0.8 }); cue('Sandbox: tumbleweed bounce', 'weed', { force: 0.4, soft: true });
cue('Battle: pickup', 'pickup'); cue('Battle: jump', 'jump'); cue('Battle: boost', 'boost');
cue('Rally: 3, 2, 1', 'count'); cue('Rally: GO', 'go');
cue('Battle: takedown', 'takedown'); cue('Battle: double takedown', 'takedown', { combo: 2 }); cue('Battle: wave', 'wave');
</script>
</body>
</html>
